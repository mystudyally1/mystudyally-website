<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;color:#3C3C3C}a{color:#1CB0F6;text-decoration:none}a:hover{color:#1899D6}*{box-sizing:border-box}</style>
</helmet>
<section style="padding:64px clamp(20px,5vw,32px)">
  <div style="max-width:1280px;margin:0 auto;position:relative;border-radius:32px;padding:96px 48px;text-align:center;overflow:hidden;background:#58CC02;box-shadow:0 2px 4px rgba(60,60,60,0.06), 0 4px 0 #49AD00">
    <div style="position:absolute;left:-120px;top:-140px;width:420px;height:420px;border-radius:999px;background:rgba(255,255,255,0.18);filter:blur(80px);pointer-events:none"></div>
    <div style="position:absolute;right:-100px;bottom:-160px;width:420px;height:420px;border-radius:999px;background:rgba(63,156,2,0.45);filter:blur(90px);pointer-events:none"></div>
    <div style="position:relative">
      <span style="display:inline-block;background:rgba(255,255,255,0.16);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:999px;padding:6px 16px;font-size:10px;font-weight:700;letter-spacing:0.16em;backdrop-filter:blur(8px)">{{ eyebrow }}</span>
      <h2 style="font-size:clamp(25px,3.28vw,42px);font-weight:800;letter-spacing:-0.01em;color:#fff;margin:20px auto 0;max-width:680px;text-wrap:balance">{{ headline }}</h2>
      <p style="font-size:15px;color:rgba(255,255,255,0.88);margin:14px auto 0;max-width:520px;line-height:1.6">{{ sub }}</p>
      <a href="Inquiry.dc.html" style="display:inline-block;margin-top:30px;background:#FFFFFF;color:#1899D6;border-radius:16px;padding:14px 28px;font-size:14px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,0.22)" style-hover="background:#F7F7F7;color:#1899D6">{{ ctaLabel }}</a>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;1280px&quot;, &quot;height&quot;: &quot;460px&quot; },
  &quot;eyebrow&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;GET STARTED&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;headline&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Ready to get your child the right support?&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;sub&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Tell us what they need — we'll take it from there.&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;ctaLabel&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Submit an Inquiry&quot;, &quot;tsType&quot;: &quot;string&quot; }
}"></script>
</body>
</html>

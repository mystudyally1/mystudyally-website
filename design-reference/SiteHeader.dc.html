<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,sans-serif;color:#3C3C3C}a{color:#1CB0F6;text-decoration:none}a:hover{color:#1899D6}*{box-sizing:border-box}@media (max-width:767px){#msa-drawer{width:100vw!important}}</style>
</helmet>
<header style="position:sticky;top:0;z-index:80;background:rgba(255,255,255,0.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:2px solid #E5E5E5">
  <div style="max-width:1280px;margin:0 auto;padding:10px clamp(16px,4vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px">
    <a href="{{ homeHref }}" style="display:flex;align-items:center;gap:9px;color:#3C3C3C;font-weight:800;font-size:17px;white-space:nowrap">
      <span style="width:28px;height:28px;border-radius:9px;background:#58CC02;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;box-shadow:0 2px 0 #58A700">M</span>
      MyStudyAlly
    </a>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav id="msa-curricula-nav" style="display:flex;align-items:center;gap:2px;position:relative">
        <button onClick="{{ toggleMenu }}" style="background:{{ curBg }};border:none;color:{{ curColor }};border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap" style-hover="color:#1CB0F6">Curricula {{ caret }}</button>
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <a href="{{ it.href }}" style="background:{{ it.bg }};color:{{ it.color }};border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap" style-hover="color:#1CB0F6">{{ it.label }}</a>
        </sc-for>
        <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:48px;left:0;width:min(860px,calc(100vw - 48px));background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);border:2px solid #E5E5E5;border-radius:20px;display:grid;grid-template-columns:minmax(190px,250px) 1fr;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.12)">
            <div style="border-right:2px solid #E5E5E5;padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:#F7F7F7">
              <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#AFAFAF;padding:4px 12px 8px">EXAM BOARD CURRICULA</div>
              <sc-for list="{{ boardTabs }}" as="c" hint-placeholder-count="8">
                <button onMouseEnter="{{ c.hover }}" onClick="{{ c.hover }}" style="background:{{ c.bg }};color:{{ c.color }};border:none;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13.5px;font-weight:700;text-align:left;cursor:pointer">{{ c.name }}</button>
              </sc-for>
              <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#AFAFAF;padding:12px 12px 8px">TEST PREP</div>
              <sc-for list="{{ testTabs }}" as="c" hint-placeholder-count="2">
                <button onMouseEnter="{{ c.hover }}" onClick="{{ c.hover }}" style="background:{{ c.bg }};color:{{ c.color }};border:none;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:13.5px;font-weight:700;text-align:left;cursor:pointer">{{ c.name }}</button>
              </sc-for>
            </div>
            <div style="padding:22px 26px;display:flex;flex-direction:column">
              <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#AFAFAF;margin-bottom:14px">{{ panelLabel }}</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 18px;align-content:start;flex:1">
                <sc-for list="{{ panelSubjects }}" as="s" hint-placeholder-count="9">
                  <a href="{{ s.href }}" style="color:#3C3C3C;font-size:13.5px;font-weight:600;padding:6px 8px;border-radius:10px" style-hover="background:#DDF4FF;color:#1899D6">{{ s.name }}</a>
                </sc-for>
              </div>
              <div style="border-top:2px solid #E5E5E5;margin-top:18px;padding-top:14px">
                <a href="{{ panelHref }}" style="font-size:13px;font-weight:800;color:#1CB0F6" style-hover="color:#1899D6">{{ panelCta }} ↗</a>
              </div>
            </div>
          </div>
        </sc-if>
      </nav>
      <div style="display:flex;align-items:center;gap:14px">
        <a href="#" style="color:#3C3C3C;font-size:13px;font-weight:700;white-space:nowrap" style-hover="color:#131F24">Sign in</a>
        <a href="Inquiry.dc.html" style="background:#58CC02;color:#fff;border-radius:14px;padding:10px 18px;font-size:13px;font-weight:800;letter-spacing:0.03em;box-shadow:0 4px 0 #58A700;white-space:nowrap" style-hover="background:#49AD00;color:#fff;box-shadow:0 4px 0 #49AD00">Submit an inquiry</a>
      </div>
    </sc-if>

    <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ openMobile }}" aria-label="Open menu" style="width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:5px;background:transparent;border:none;cursor:pointer;padding:0">
        <span style="width:22px;height:2.5px;border-radius:2px;background:#3C3C3C;display:block"></span>
        <span style="width:22px;height:2.5px;border-radius:2px;background:#3C3C3C;display:block"></span>
        <span style="width:15px;height:2.5px;border-radius:2px;background:#3C3C3C;display:block"></span>
      </button>
    </sc-if>
  </div>
</header>

<sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
  <div id="msa-drawer" style="position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:{{ drawerWidth }};z-index:120;background:#FFFFFF;display:flex;flex-direction:column">
    <div style="height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,20px);border-bottom:1px solid #E5E5E5">
      <a href="{{ homeHref }}" style="display:flex;align-items:center;gap:9px;color:#3C3C3C;font-weight:800;font-size:16px">
        <span style="width:26px;height:26px;border-radius:8px;background:#58CC02;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800">M</span>
        MyStudyAlly
      </a>
      <button onClick="{{ closeMobile }}" aria-label="Close menu" style="width:44px;height:44px;background:transparent;border:none;font-size:22px;font-family:inherit;color:#3C3C3C;cursor:pointer">✕</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:0 clamp(16px,4vw,20px) 20px">
      <button onClick="{{ toggleCurricula }}" style="width:100%;min-height:56px;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;border-bottom:1px solid #E5E5E5;font-family:inherit;font-size:16px;font-weight:700;color:#3C3C3C;cursor:pointer;padding:0">
        Curricula<span style="font-size:13px;color:#777777">{{ curriculaCaret }}</span>
      </button>
      <sc-if value="{{ curriculaOpen }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;background:#F7F7F7;border-bottom:1px solid #E5E5E5">
          <sc-for list="{{ mobileCurricula }}" as="c" hint-placeholder-count="10">
            <a href="{{ c.href }}" style="min-height:48px;display:flex;align-items:center;padding:0 14px;font-size:15px;font-weight:600;color:#3C3C3C;border-bottom:1px solid #EAEAEA">{{ c.name }}</a>
          </sc-for>
        </div>
      </sc-if>
      <sc-for list="{{ mobileLinks }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="min-height:56px;display:flex;align-items:center;font-size:16px;font-weight:700;color:#3C3C3C;border-bottom:1px solid #E5E5E5">{{ l.label }}</a>
      </sc-for>
      <div style="display:flex;align-items:center;gap:18px;padding:20px 0 0">
        <a href="{{ blogHref }}" style="font-size:12px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;color:#777777;min-height:44px;display:flex;align-items:center">Blog</a>
        <a href="{{ faqHref }}" style="font-size:12px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;color:#777777;min-height:44px;display:flex;align-items:center">FAQ</a>
      </div>
    </div>
    <div style="flex-shrink:0;border-top:1px solid #E5E5E5;padding:14px clamp(16px,4vw,20px) 18px;display:flex;flex-direction:column;gap:12px">
      <a href="#" style="align-self:flex-start;font-size:14px;font-weight:700;color:#3C3C3C;min-height:44px;display:flex;align-items:center">Sign in</a>
      <a href="Inquiry.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;background:#58CC02;color:#fff;border-radius:14px;font-size:15px;font-weight:800;box-shadow:0 4px 0 #58A700" style-hover="background:#49AD00;color:#fff">Submit an inquiry</a>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;1280px&quot;, &quot;height&quot;: &quot;80px&quot; },
  &quot;active&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;,&quot;subjects&quot;,&quot;tutors&quot;,&quot;pricing&quot;,&quot;blog&quot;,&quot;about&quot;,&quot;faq&quot;,&quot;contact&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;forceMobile&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  state = { menuOpen: false, mobileOpen: false, curriculaOpen: true, tab: "IGCSE", vw: typeof window !== "undefined" ? window.innerWidth : 1280 };
  componentDidMount() {
    this._onResize = () => this.setState({ vw: window.innerWidth });
    window.addEventListener("resize", this._onResize);
    this._onResize();
    this._onDocDown = (e) => {
      if (!this.state.menuOpen) return;
      const nav = document.getElementById("msa-curricula-nav");
      if (nav && nav.contains(e.target)) return;
      this.setState({ menuOpen: false });
    };
    this._onKey = (e) => { if (e.key === "Escape" && this.state.menuOpen) this.setState({ menuOpen: false }); };
    document.addEventListener("pointerdown", this._onDocDown, true);
    document.addEventListener("keydown", this._onKey);
  }
  _broadcast() {
    const isDesktop = (this.props.forceMobile ?? false) ? false : this.state.vw >= 1024;
    const open = this.state.mobileOpen && !isDesktop;
    if (this._lastBroadcast === open) return;
    this._lastBroadcast = open;
    window.__msaMobileMenuOpen = open;
    const emit = () => {
      const el = document.getElementById("msa-drawer");
      const r = el ? el.getBoundingClientRect() : null;
      const detail = { open, rect: r ? { left: r.left, right: r.right, top: r.top, bottom: r.bottom } : null };
      window.__msaMobileMenuRect = detail.rect;
      window.dispatchEvent(new CustomEvent("msa-mobile-menu", { detail }));
    };
    emit();
    requestAnimationFrame(emit);
  }
  componentDidUpdate() { this._broadcast(); }
  componentWillUnmount() {
    window.__msaMobileMenuOpen = false;
    window.dispatchEvent(new CustomEvent("msa-mobile-menu", { detail: { open: false } }));
    window.removeEventListener("resize", this._onResize);
    document.removeEventListener("pointerdown", this._onDocDown, true);
    document.removeEventListener("keydown", this._onKey);
  }
  renderVals() {
    const active = this.props.active ?? "home";
    const isDesktop = (this.props.forceMobile ?? false) ? false : this.state.vw >= 1024;
    const useMobileLinks = !!(this.props.forceMobile ?? false) || this.state.vw < 768;
    const MOB = {
      "MyStudyAlly Homepage.dc.html": "Homepage Mobile.dc.html",
      "About.dc.html": "About Mobile.dc.html",
      "Blog.dc.html": "Blog Mobile.dc.html",
      "Contact.dc.html": "Contact Mobile.dc.html",
      "FAQ.dc.html": "FAQ Mobile.dc.html",
      "Pricing v2.dc.html": "Pricing v2 Mobile.dc.html",
      "Tutors.dc.html": "Tutors Mobile.dc.html",
      "IGCSE.dc.html": "IGCSE Mobile.dc.html",
      "GCSE.dc.html": "GCSE Mobile.dc.html",
      "A Levels.dc.html": "A Levels Mobile.dc.html",
      "IB.dc.html": "IB Mobile.dc.html",
      "SABIS.dc.html": "SABIS Mobile.dc.html",
      "HKDSE.dc.html": "HKDSE Mobile.dc.html",
      "American Curriculum.dc.html": "American Curriculum Mobile.dc.html",
      "Canadian Curriculum.dc.html": "Canadian Curriculum Mobile.dc.html",
      "IELTS.dc.html": "IELTS Mobile.dc.html",
      "SAT.dc.html": "SAT Mobile.dc.html",
    };
    const mh = (h) => (useMobileLinks && MOB[h]) ? MOB[h] : h;
    const links = [
      { key: "tutors", label: "Tutors", href: mh("Tutors.dc.html") },
      { key: "pricing", label: "Pricing", href: mh("Pricing v2.dc.html") },
      { key: "about", label: "About", href: mh("About.dc.html") },
      { key: "contact", label: "Contact", href: mh("Contact.dc.html") },
    ];
    const items = links.map(l => ({
      ...l,
      bg: l.key === active ? "#DDF4FF" : "transparent",
      color: l.key === active ? "#1899D6" : "#777777",
    }));
    const menu = {
      "IGCSE": { href: "IGCSE.dc.html", subjects: ["Mathematics","Additional Mathematics","Physics","Chemistry","Biology","English Language","English Literature","Economics","Business Studies","Accounting","Computer Science"] },
      "GCSE": { href: "GCSE.dc.html", subjects: ["Mathematics","English Language","English Literature","Biology","Chemistry","Physics","Combined Science","Geography","History","Business Studies","Economics","Computer Science","French"] },
      "A Levels": { href: "A Levels.dc.html", subjects: ["Mathematics","Further Mathematics","Physics","Chemistry","Biology","Economics","Business Studies","Accounting","Computer Science","English Literature","Psychology","Sociology","Geography","History","Law"] },
      "IB": { href: "IB.dc.html", subjects: ["Math AA","Math AI","Physics","Chemistry","Biology","Economics","Business Management","English A: Language & Literature","Psychology","Computer Science","TOK / EE support"] },
      "SABIS": { href: "SABIS.dc.html", subjects: ["Mathematics","English","Science","Social Studies","French"] },
      "HKDSE": { href: "HKDSE.dc.html", subjects: ["Mathematics (Compulsory)","Mathematics Extended (M1/M2)","English Language","Biology","Chemistry","Physics","Economics","BAFS","ICT"] },
      "American": { href: "American Curriculum.dc.html", subjects: ["AP Calculus AB/BC","AP Biology","AP Chemistry","AP Physics 1/2/C","AP English Language","AP English Literature","AP US History","AP World History","AP Economics (Micro/Macro)","AP Computer Science A","Algebra I/II","Geometry"] },
      "Canadian": { href: "Canadian Curriculum.dc.html", subjects: ["Mathematics","English","Biology","Chemistry","Physics","Canadian & World History","Civics & Careers","French","Business Studies","Computer Science"] },
      "IELTS": { href: "IELTS.dc.html", subjects: ["Listening","Reading","Writing","Speaking"] },
      "SAT": { href: "SAT.dc.html", subjects: ["Math","Reading & Writing"] },
    };
    Object.keys(menu).forEach(k => { menu[k] = { ...menu[k], href: mh(menu[k].href) }; });
    const tab = this.state.tab;
    const mkTab = name => {
      const on = tab === name;
      return { name, bg: on ? "#DDF4FF" : "transparent", color: on ? "#1899D6" : "#3C3C3C", hover: () => this.setState({ tab: name }) };
    };
    const boardTabs = ["IGCSE","GCSE","A Levels","IB","SABIS","HKDSE","American","Canadian"].map(mkTab);
    const testTabs = ["IELTS","SAT"].map(mkTab);
    const cur = menu[tab];
    const panelSubjects = cur.subjects.map(n => ({ name: n, href: cur.href }));
    const mobileCurricula = Object.keys(menu).map(k => ({ name: k === "American" ? "American Curriculum" : k === "Canadian" ? "Canadian Curriculum" : k, href: menu[k].href }));
    return {
      items, boardTabs, testTabs, panelSubjects, mobileCurricula,
      mobileLinks: links,
      homeHref: mh("MyStudyAlly Homepage.dc.html"),
      blogHref: mh("Blog.dc.html"),
      faqHref: mh("FAQ.dc.html"),
      isDesktop,
      isCompact: !isDesktop,
      panelLabel: tab.toUpperCase() + " SUBJECTS",
      panelHref: cur.href,
      panelCta: "View all " + tab + " tutoring",
      curBg: active === "subjects" ? "#DDF4FF" : "transparent",
      curColor: active === "subjects" ? "#1899D6" : "#777777",
      menuOpen: this.state.menuOpen,
      caret: this.state.menuOpen ? "▴" : "▾",
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      mobileOpen: this.state.mobileOpen && !isDesktop,
      drawerWidth: (this.props.forceMobile ?? false) ? "min(100vw,430px)" : "100vw",
      openMobile: () => this.setState({ mobileOpen: true }),
      closeMobile: () => this.setState({ mobileOpen: false }),
      curriculaOpen: this.state.curriculaOpen,
      curriculaCaret: this.state.curriculaOpen ? "▴" : "▾",
      toggleCurricula: () => this.setState(s => ({ curriculaOpen: !s.curriculaOpen })),
    };
  }
}
</script>
</body>
</html>
